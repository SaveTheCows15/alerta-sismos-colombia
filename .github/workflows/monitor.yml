name: Monitor de Sismos Colombia

on:
  schedule:
    # Ejecutar cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite probarlo manualmente

jobs:
  check-earthquakes:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar script de rastreo
        run: python sismos.py

      - name: Guardar historial de sismos notificados
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add vistos.txt || true
          git commit -m "Actualizar sismos procesados" || true
          git push || true

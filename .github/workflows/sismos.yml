name: Sismos SGC -> ntfy.sh

on:
  schedule:
    # Cada 5 minutos. GitHub Actions no garantiza puntualidad exacta
    # en el schedule, puede haber unos minutos de retraso.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para poder hacer commit del archivo de estado

concurrency:
  group: sismos-sgc
  cancel-in-progress: false  # no cancelar una corrida por otra que empiece encima

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar sismos y notificar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Opcional: sube este umbral si solo te interesan sismos fuertes
          MIN_MAGNITUDE: "0"
        run: python scripts/check_sismos.py

      - name: Guardar estado (commit de los IDs de sismos ya notificados)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_ids.json
          git diff --cached --quiet && echo "Sin cambios en el estado" || git commit -m "Actualiza sismos ya notificados [skip ci]"
          git push
